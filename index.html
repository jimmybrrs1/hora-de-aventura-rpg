<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hora de Aventura RPG — Ficha</title>
<style>
*{box-sizing:border-box}
:root{--wood:#8f5f21;--wood2:#c28a35;--ink:#5a3a16;--paper:#fff9df;--paper2:#f5e7b9;--gold:#d4a33a;--sky:#8fd4ed;--grass:#9acb68}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:linear-gradient(#82cfea 0 62%,#9dce6c 62%);min-height:100vh;color:var(--ink);position:relative;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:-1;pointer-events:none;opacity:.28}
body:before{width:240px;height:120px;left:-50px;top:90px;background:radial-gradient(ellipse,#fff 0 55%,transparent 57%);filter:blur(2px)}
body:after{width:300px;height:150px;right:-70px;top:170px;background:radial-gradient(ellipse,#fff 0 55%,transparent 57%);filter:blur(3px)}
.wrap{max-width:1050px;margin:auto;padding:22px 14px 40px;position:relative}
.wrap:before,.wrap:after{content:"";position:absolute;z-index:-1;top:10px;bottom:18px;width:18px;background:repeating-linear-gradient(0deg,#7a4d18 0 9px,#b47725 9px 15px,#d39a3d 15px 19px);border:3px solid #5f3c12;box-shadow:inset 2px 0 #e1b65d,inset -2px 0 #5c3810}
.wrap:before{left:0;border-radius:12px}.wrap:after{right:0;border-radius:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px 4px;border-bottom:7px solid var(--wood);background:linear-gradient(#fff8dc,#f3e2b0);border:4px solid var(--wood);border-radius:18px 18px 8px 8px;box-shadow:0 5px 0 #5d3b13}
.top-images{display:flex;gap:10px;align-items:center}.name-images{margin:0 0 10px;justify-content:flex-start}.name-images .image-slot{width:92px;height:92px}.image-slot{width:86px;height:86px;border:4px solid var(--wood);border-radius:12px;background:linear-gradient(#fff9df,#ead49b);position:relative;overflow:hidden;box-shadow:0 4px 0 #674211;display:flex;align-items:center;justify-content:center;cursor:pointer}.image-slot img{width:100%;height:100%;object-fit:cover;display:none}.image-slot.has-image img{display:block}.image-slot .slot-text{text-align:center;font-size:11px;font-weight:900;color:#80602b;padding:5px}.image-slot.has-image .slot-text{display:none}.image-slot input{display:none}.image-slot .remove-img{position:absolute;right:2px;top:2px;width:22px;height:22px;border:2px solid #684313;border-radius:50%;background:#ffe5a0;color:#5b3b17;font-weight:900;line-height:16px;cursor:pointer;display:none}.image-slot.has-image .remove-img{display:block}.logo{font-weight:900;font-size:34px;color:#b53d36;letter-spacing:1px}.logo:before{content:"⚔ ";color:#39799a}.subtitle{color:#6a4318;font-weight:900}
.card{background:linear-gradient(135deg,rgba(255,251,229,.98),rgba(247,232,190,.98));border:6px solid var(--wood);border-radius:16px;box-shadow:0 7px 0 #5c3b13,0 0 0 3px #d5a149;margin-top:18px;padding:20px;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:7px;border:2px dashed rgba(137,89,25,.35);border-radius:10px;pointer-events:none}
.card:after{content:""}
.bar{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:2}.btn{border:3px solid #684313;border-radius:10px;background:linear-gradient(#ffe59a,#dcae4a);color:#5b3b17;padding:10px 15px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #754c16}.btn:hover{transform:translateY(-1px)}.btn.dark{background:linear-gradient(#cceefa,#80c2df)}.btn.danger{background:linear-gradient(#ffc2ad,#e98e78)}
.grid{display:grid;grid-template-columns:260px 1fr;gap:20px;position:relative;z-index:1}.portrait{height:280px;border:5px solid var(--wood);border-radius:12px;background:radial-gradient(circle at 50% 30%,#fff8d8,#ead49b);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;box-shadow:inset 0 0 0 3px #d2a04a,0 4px 0 #674211}.portrait img{width:100%;height:100%;object-fit:cover}.placeholder{text-align:center;color:#80602b;font-weight:800;padding:20px}
.small{font-size:13px;color:#80602b;margin-top:8px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-weight:900;color:#6a4318}.field input,.feat input{width:100%;border:3px solid #986b28;border-radius:8px;padding:10px;font-size:16px;background:#fffdf0;color:#4c351b;box-shadow:inset 0 2px 4px #b98c4433}.field input:focus,.feat input:focus{outline:3px solid #e4bd5b66;border-color:#704815}.name{font-size:26px;font-weight:900}.attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:12px}.attr{background:linear-gradient(#fff9df,#f1dfaa);border:4px solid var(--wood);border-radius:12px;padding:13px;position:relative;overflow:hidden;box-shadow:0 4px 0 #674211}.attr:after{content:""}.attr-title{display:grid;grid-template-columns:1fr 75px;gap:7px}.attr-title input{font-weight:900}.feats{margin-top:12px;display:grid;gap:7px}.feat{display:flex;align-items:center;gap:7px}.feat b{width:24px;text-align:center;color:#9b6b20}.section-title{font-size:20px;font-weight:900;margin:0 0 10px;color:#704718}.master{display:none}.master.show{display:block}.notice{padding:10px 13px;border-radius:9px;background:#ffe7a0;border:3px solid #a77422;font-weight:700}.login{max-width:380px;margin:20px auto}.login input{width:100%;padding:12px;border:3px solid #7b531c;border-radius:8px;font-size:18px;margin:8px 0}.footer{text-align:center;color:#fff9dd;font-weight:900;margin-top:15px;position:relative}.footer:before{content:"";display:none}.hidden{display:none!important}
.bigtext{width:100%;min-height:150px;resize:vertical;border:3px solid #986b28;border-radius:8px;padding:12px;font:inherit;font-size:16px;background:#fffdf0;color:#4c351b;box-shadow:inset 0 2px 4px #b98c4433}.bigtext:focus{outline:3px solid #e4bd5b66;border-color:#704815}
.sheetgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.priority-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;margin-top:20px}.notes-card{margin-top:20px}.attack-list{display:grid;gap:10px}.attack-row{display:grid;grid-template-columns:1fr 110px;gap:10px}.attack-row input{width:100%;border:3px solid #986b28;border-radius:8px;padding:10px;font-size:16px;background:#fffdf0;color:#4c351b}.attack-row label{font-weight:900;color:#704718;display:flex;align-items:center}.priority{border-left:8px solid #c28a35}.priority .section-title:after{content:' • prioridade';font-size:12px;vertical-align:middle;opacity:.7}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.statbox{background:linear-gradient(#fff9df,#f1dfaa);border:4px solid var(--wood);border-radius:12px;padding:13px;box-shadow:0 4px 0 #674211}.statbox label{display:block;font-weight:900;color:#704718;margin-bottom:7px}.statbox input{width:100%;border:3px solid #986b28;border-radius:8px;padding:10px;font-size:16px;background:#fffdf0;color:#4c351b}.status-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.status-row .statbox{text-align:center}.status-row input{text-align:center;font-weight:900}.hp{font-size:22px;font-weight:900;text-align:center}.hp input{font-size:20px}
@media(max-width:760px){.sheetgrid,.priority-grid{grid-template-columns:1fr}.status-row{grid-template-columns:1fr}.mini-grid{grid-template-columns:1fr}.attack-row{grid-template-columns:1fr}}
/* Decoração limpa: mantém a estrutura original e usa apenas cores, molduras e textura. */
@media(max-width:760px){.grid{grid-template-columns:1fr}.attrs{grid-template-columns:1fr}.portrait{height:300px}.top{padding-right:8px}.wrap:before,.wrap:after{width:10px}}
</style></head>
<body><div class="wrap">
<header class="top"><div><div class="logo">Hora de Aventura RPG</div><div class="subtitle">Ficha de personagem</div></div><div class="bar"><button class="btn dark" id="masterBtn">Modo Mestre</button><button class="btn" id="saveBtn">Salvar</button><button class="btn danger" id="clearBtn">Limpar</button></div></header>
<div class="card"><div class="grid">
<section>
<div class="top-images name-images"><label class="image-slot" id="slot1"><span class="slot-text">Imagem 1<br>+ adicionar</span><img id="img1"><input id="image1" type="file" accept="image/*"><button type="button" class="remove-img" data-slot="1">×</button></label><label class="image-slot" id="slot2"><span class="slot-text">Imagem 2<br>+ adicionar</span><img id="img2"><input id="image2" type="file" accept="image/*"><button type="button" class="remove-img" data-slot="2">×</button></label></div><div class="field"><label>Nome</label><input class="name" id="charName" placeholder="Digite o nome..."></div>
<div class="field"><label>Jogador</label><input id="player" placeholder="Nome do jogador..."></div>
<div class="field"><label>Conceito</label><input id="desc" placeholder="Conceito do personagem..."></div>
<div class="field"><label>Histórico</label><textarea class="bigtext" id="history" placeholder="Conte a história do personagem..."></textarea></div>
</section>
<section>
<div class="field"><label>Movimentos</label><textarea class="bigtext" id="moves" placeholder="Movimentos, habilidades e ações..."></textarea></div>
<div class="field"><label>Equipamento</label><textarea class="bigtext" id="equipment" placeholder="Armas, equipamentos e itens..."></textarea></div>
</section></div></div>
<div class="card"><h2 class="section-title">Atributos</h2><div class="attrs" id="attrs"></div></div>
<div class="priority-grid">
<div class="card priority"><h2 class="section-title">Ataques</h2><div class="attack-list">
<div class="attack-row"><label>Ataque 1</label><input id="attack1" placeholder="Dano / bônus"></div>
<div class="attack-row"><label>Ataque 2</label><input id="attack2" placeholder="Dano / bônus"></div>
<div class="attack-row"><label>Ataque 3</label><input id="attack3" placeholder="Dano / bônus"></div>
</div><textarea class="bigtext" id="attacksNotes" style="margin-top:12px;min-height:100px" placeholder="Detalhes dos ataques, efeitos e observações..."></textarea></div>
<div class="card priority"><h2 class="section-title">Magias</h2><textarea class="bigtext" id="spells" placeholder="Magias, poderes, custos e efeitos..."></textarea></div>
</div>
<div class="sheetgrid">
<div class="card"><h2 class="section-title">Inventário</h2><textarea class="bigtext" id="inventory" placeholder="Itens carregados pelo personagem..."></textarea></div>
<div class="card"><h2 class="section-title">Pontos de Herói</h2><div class="mini-grid"><div class="statbox hp"><label>Pontos de Herói</label><input id="heroPoints" type="number" min="0" value="0"></div><div class="statbox hp"><label>Vida</label><input id="life" type="number" min="0" value="0"></div></div><div class="mini-grid" style="margin-top:12px"><div class="statbox"><label>Pontos de Experiência (XP)</label><input id="xp" type="number" min="0" value="0"></div></div></div>
</div>
<div class="card notes-card"><h2 class="section-title">Notas</h2><textarea class="bigtext" id="notes" placeholder="Anotações importantes, objetivos, pistas, lembretes..."></textarea></div>
<div class="status-row">
<div class="statbox"><label>Estado</label><input id="state1" placeholder="Estado..."></div>
<div class="statbox"><label>Estado</label><input id="state2" placeholder="Estado..."></div>
<div class="statbox"><label>Estado</label><input id="state3" placeholder="Estado..."></div>
</div>
<div class="card master" id="masterPanel"><h2 class="section-title">Área do Mestre</h2><div class="notice">Modo Mestre desbloqueado.</div><div class="field" style="margin-top:12px"><label>Observações do Mestre</label><input id="masterNotes" placeholder="Anotações..." /></div></div>
<div class="footer">Tudo é salvo neste navegador neste dispositivo.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://oefkvtytquczuwuelqys.supabase.co';
const SUPABASE_KEY='sb_publishable_0gdjKbBkzfpGl0RiF5E6Dg_7veFGybY';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const KEY='ooo_rpg_ficha_v6';
const IDKEY='hora_aventura_rpg_character_id';
const defaults=[{name:'Atributo 1',num:'0',feats:['Proeza 1','Proeza 2','Proeza 3']},{name:'Atributo 2',num:'0',feats:['Proeza 1','Proeza 2','Proeza 3']},{name:'Atributo 3',num:'0',feats:['Proeza 1','Proeza 2','Proeza 3']}];
const blank={charName:'',player:'',desc:'',history:'',moves:'',equipment:'',inventory:'',heroPoints:'0',life:'0',xp:'0',state1:'',state2:'',state3:'',attack1:'',attack2:'',attack3:'',attacksNotes:'',spells:'',notes:'',attrs:structuredClone(defaults),masterNotes:'',image1:'',image2:''};

let data=Object.assign({},blank,JSON.parse(localStorage.getItem(KEY)||'null')||{});
if(!Array.isArray(data.attrs)) data.attrs=structuredClone(defaults);

const params=new URLSearchParams(location.search);
let characterId=params.get('id')||localStorage.getItem(IDKEY)||'';
if(characterId) localStorage.setItem(IDKEY,characterId);

const $=id=>document.getElementById(id);

function render(){
  ['charName','player','desc','history','moves','equipment','inventory','heroPoints','life','xp','state1','state2','state3','masterNotes','attack1','attack2','attack3','attacksNotes','spells','notes'].forEach(k=>{if($(k))$(k).value=data[k]??''});
  let a=$('attrs');a.innerHTML='';
  data.attrs.forEach((x,i)=>{
    let d=document.createElement('div');d.className='attr';
    d.innerHTML=`<div class="attr-title"><input data-k="name" data-i="${i}" value="${esc(x.name)}"><input data-k="num" data-i="${i}" value="${esc(x.num)}" type="text"></div><div class="feats">${x.feats.map((f,j)=>`<div class="feat"><b>${j+1}</b><input data-k="feat" data-i="${i}" data-j="${j}" value="${esc(f)}"></div>`).join('')}</div>`;
    a.appendChild(d);
  });
  ['1','2'].forEach(n=>{
    let slot=$('slot'+n),img=$('img'+n);
    if(data['image'+n]){img.src=data['image'+n];slot.classList.add('has-image')}
    else{img.removeAttribute('src');slot.classList.remove('has-image')}
  });
}

function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}

function collect(){
  ['charName','player','desc','history','moves','equipment','inventory','heroPoints','life','xp','state1','state2','state3','masterNotes','attack1','attack2','attack3','attacksNotes','spells','notes'].forEach(k=>{if($(k))data[k]=$(k).value});
  document.querySelectorAll('[data-k]').forEach(el=>{
    let i=+el.dataset.i,k=el.dataset.k;
    if(k==='feat')data.attrs[i].feats[+el.dataset.j]=el.value;
    else data.attrs[i][k]=el.value;
  });
}

function saveLocal(){
  collect();
  localStorage.setItem(KEY,JSON.stringify(data));
}

let syncTimer=null;
function queueSync(){
  saveLocal();
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>saveRemote(false),900);
}

async function saveRemote(showAlert=true){
  saveLocal();
  if(!characterId) characterId=crypto.randomUUID();
  localStorage.setItem(IDKEY,characterId);

  const payload={
    character_id:characterId,
    data:data,
    updated_at:new Date().toISOString()
  };

  const {error}=await sb.from('characters').upsert(payload,{onConflict:'character_id'});
  if(error){
    console.error('Supabase:',error);
    if(showAlert) alert('Ficha salva neste dispositivo, mas não foi possível sincronizar com o banco.');
    return false;
  }
  if(showAlert) alert('Ficha salva e sincronizada com o banco!');
  return true;
}

async function loadRemote(){
  if(!characterId) return;
  const {data:rows,error}=await sb.from('characters').select('character_id,data').eq('character_id',characterId).limit(1);
  if(error){console.error('Supabase:',error);return}
  if(rows&&rows[0]&&rows[0].data){
    data=Object.assign({},blank,rows[0].data);
    if(!Array.isArray(data.attrs))data.attrs=structuredClone(defaults);
    localStorage.setItem(KEY,JSON.stringify(data));
    render();
  }
}

$('saveBtn').onclick=()=>saveRemote(true);

document.addEventListener('input',e=>{
  if(e.target.matches('input,textarea')) queueSync();
});

['1','2'].forEach(n=>{
  let input=$('image'+n);
  input.addEventListener('change',e=>{
    let f=e.target.files[0];if(!f)return;
    let r=new FileReader();
    r.onload=()=>{data['image'+n]=r.result;saveLocal();render();saveRemote(false)};
    r.readAsDataURL(f);
  });
  $('slot'+n).addEventListener('click',e=>{if(e.target.classList.contains('remove-img'))return;input.click()});
  document.querySelector('.remove-img[data-slot="'+n+'"]').addEventListener('click',e=>{
    e.preventDefault();e.stopPropagation();data['image'+n]='';input.value='';saveLocal();render();saveRemote(false);
  });
});

$('clearBtn').onclick=()=>{
  if(confirm('Apagar todos os dados desta ficha?')){
    localStorage.removeItem(KEY);
    data=structuredClone(blank);
    data.attrs=structuredClone(defaults);
    render();
    if(characterId) saveRemote(false);
  }
};

$('masterBtn').onclick=()=>{
  let p=prompt('Senha do Mestre:');
  if(p==='147258')$('masterPanel').classList.toggle('show');
  else if(p!==null)alert('Senha incorreta.')
};

render();
loadRemote();
</script></body></html>
